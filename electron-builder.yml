# 모니터 프렌즈 패키징 설정 (비둘기 모니터·월급루팡 낚시터와 같은 틀)
# - 맥: 유니버설(arm64+x64) dmg + zip(자동 업데이트용). 서명: ~/.minimi-signing Developer ID (scripts/build-mac.mjs) · 공증: minimi-notary
# - 윈도우: 서명 없이 NSIS. 파일명 고정(MonitorFriends-Setup.exe) — 버전을 붙이면 SmartScreen 평판이 초기화된다.
# - koffi(창 위치·마우스 버튼 읽기 FFI) 네이티브 모듈은 extraResources 로 넣는다 (scripts/fetch-koffi.mjs 가 build/koffi/ 에 받아 둔다)
appId: com.monitorfriends.app
# 맥에서 번들/헬퍼 이름이 한글이면 Electron 이 시작 시 크래시 → 파일 이름은 영문, 표시 이름만 한글
productName: MonitorFriends
copyright: Copyright © 2026 monitor-friends
npmRebuild: false
directories:
  output: dist
  buildResources: build
electronLanguages: [ko, en]
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!out/renderer/lab.html'
  - '!out/renderer/assets/lab-*'
  - '!node_modules/@koromix/**'
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  x64ArchFiles: '**/koffi/**'
  extraResources:
    - from: build/koffi/darwin_x64
      to: koffi/darwin_x64
      filter: [koffi.node]
    - from: build/koffi/darwin_arm64
      to: koffi/darwin_arm64
      filter: [koffi.node]
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: MonitorFriends-mac.${ext}
  extendInfo:
    CFBundleDisplayName: 모니터 프렌즈
    NSHumanReadableCopyright: Copyright © 2026 monitor-friends
dmg:
  title: 모니터 프렌즈
  artifactName: MonitorFriends-mac.dmg
  window:
    width: 540
    height: 380
win:
  executableName: MonitorFriends
  icon: build/icon.png
  extraResources:
    - from: build/koffi/win32_x64
      to: koffi/win32_x64
      filter: [koffi.node]
  target:
    - target: nsis
      arch: x64
  artifactName: MonitorFriends-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 모니터 프렌즈
  artifactName: MonitorFriends-Setup.${ext}
  deleteAppDataOnUninstall: false
publish:
  # 자동 업데이트·고정 다운로드 주소 (공개 저장소 Releases) — 저장소를 만든 뒤 쓴다
  provider: github
  owner: kanchoooo
  repo: monitor-friends
  releaseType: draft
